name: Hourly AI News Pipeline

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

jobs:
  trigger-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Call API Endpoint
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$SITE_URL" ]; then
            echo "Error: SITE_URL secret is not set"
            exit 1
          fi
          
          API_URL="${SITE_URL}/api/run-job"
          echo "Calling: $API_URL"
          
          for attempt in 1 2 3; do
            echo "Attempt $attempt of 3"
            
            HTTP_CODE=$(curl -s -o response.txt -w "%{http_code}" \
              -X POST "$API_URL" \
              -H "Authorization: Bearer $CRON_SECRET" \
              -H "Content-Type: application/json" \
              -d '{}')
            
            echo "Response code: $HTTP_CODE"
            cat response.txt
            echo ""
            
            if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
              echo "Success!"
              exit 0
            fi
            
            echo "Attempt $attempt failed with status $HTTP_CODE"
            
            if [ "$attempt" -lt 3 ]; then
              echo "Retrying in 10 seconds..."
              sleep 10
            fi
          done
          
          echo "All 3 attempts failed"
          exit 1
