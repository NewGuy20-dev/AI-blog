name: Trigger AI News Pipeline

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

jobs:
  trigger-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Call API Endpoint
        run: |
          curl -X POST "https://${{ secrets.NEXT_PUBLIC_SITE_URL }}/api/run-job" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json" \
            -d '{"topic": "Artificial Intelligence News"}' \
            -v
